name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  # ── Backend Lint + Test ────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apnasamaj
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: apnasamaj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U apnasamaj"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check apps/

      - name: Format check with Black
        run: black --check apps/

      - name: Type check with MyPy
        run: mypy apps/api/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: apnasamaj
          DB_PASSWORD: test_password
          DB_NAME: apnasamaj_test
          REDIS_HOST: localhost
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: development
        run: pytest apps/api/ -v --tb=short

  # ── Frontend Lint + Test ───────────────────────────────────
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    if: false  # Enable when web app is scaffolded

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Type check
        working-directory: apps/web
        run: npm run type-check

      - name: Test
        working-directory: apps/web
        run: npm run test -- --run

  # ── Docker Build ───────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t apnasamaj-api:test .

      - name: Verify health check
        run: |
          docker compose up -d db redis
          sleep 5
          docker compose up -d api
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker compose down -v
