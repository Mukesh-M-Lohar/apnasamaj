site_name: ApnaSamaj
site_description: "Enterprise-ready digital platform for residential communities, housing societies, and non-profits."
site_author: ApnaSamaj Contributors
site_url: https://mukesh-m-lohar.github.io/apnasamaj/

repo_name: Mukesh-M-Lohar/apnasamaj
repo_url: https://github.com/Mukesh-M-Lohar/apnasamaj
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides # In case they add custom CSS/HTML later
  logo: material/city-variant-outline
  favicon: material/city-variant-outline
  font:
    text: Inter
    code: Roboto Mono
  palette:
    # Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.expand
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - header.autohide

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Mukesh-M-Lohar
    - icon: fontawesome/brands/twitter
      link: https://twitter.com
  generator: false

plugins:
  - search

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.magiclink
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Deployment: deployment.md
