[project]
name = "apnasamaj"
version = "0.1.0"
description = "Community management platform for Indian societies"
requires-python = ">=3.12"

dependencies = [
    # ── Framework ────────────────────────────────────────────────
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.12",
    "python-dotenv==1.0.1",

    # ── Database ─────────────────────────────────────────────────
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",

    # ── Validation ───────────────────────────────────────────────
    "pydantic==2.10.0",
    "pydantic-settings==2.6.0",

    # ── Security ─────────────────────────────────────────────────
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.0",

    # ── Cache / Queue ────────────────────────────────────────────
    "redis==5.2.0",
    "celery==5.4.0",

    # ── Storage ──────────────────────────────────────────────────
    "minio==7.2.12",

    # ── Monitoring ───────────────────────────────────────────────
    "prometheus-client==0.21.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.0",
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "black==24.10.0",
    "ruff==0.8.0",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
    "Faker==33.1.0",
    "mkdocs==1.6.0",
    "mkdocs-material==9.5.31",
]

# ── Build system ─────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

# ── Dependency groups (uv) ───────────────────────────────────────────────────
[dependency-groups]
dev = [
    "httpx==0.28.0",
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "black==24.10.0",
    "ruff==0.8.0",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
    "Faker==33.1.0",
    "mkdocs==1.6.0",
    "mkdocs-material==9.5.31",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

# ── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 119
target-version = ["py312"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
